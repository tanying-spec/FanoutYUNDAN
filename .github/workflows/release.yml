name: Release

on:
  push:
    branches:
      - main
      - "dev/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: true
      - name: Test
        run: go test ./...
      - name: Build Linux binaries
        env:
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o fanout-yundan-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o fanout-yundan-linux-arm64 .
          sha256sum fanout-yundan-linux-amd64 fanout-yundan-linux-arm64 > checksums.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            fanout-yundan-linux-amd64
            fanout-yundan-linux-arm64
            checksums.txt
      - name: Upload workflow artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v6
        with:
          name: fanout-yundan-linux
          path: |
            fanout-yundan-linux-amd64
            fanout-yundan-linux-arm64
            checksums.txt
